<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SWC Club TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;700&display=swap">
<style>
/* Club TV: one screen, nothing rotates. Built for a 1920x1080 TV; sizes scale with the screen.
   Practice days and times come from /schedule.js and tournaments from the homepage list, so this page
   never needs editing. The red notice bar comes from the "SWC TV notice" Google Sheet (NOTICE_CSV below). */
:root{--blue:#0B4BB5;--red:#C8102E;--ink:#0B1220;--panel:#121C33;--line:#26324F;--txt:#F4F6FB;--muted:#A9B4CC;
--display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:var(--body);overflow:hidden;cursor:none}
.top{height:10vh;display:flex;align-items:center;gap:1.4vw;padding:0 3vw;background:#060B16;border-bottom:.5vh solid var(--red)}
.top img{height:7.4vh;width:7.4vh}
.top .club{font-family:var(--display);font-weight:800;font-size:4.4vh;letter-spacing:.04em;text-transform:uppercase}
.top .clock{margin-left:auto;font-family:var(--display);font-weight:800;font-size:4.6vh}
.main{height:90vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3vw;padding:4vh 3vw}
h2{margin:0 0 2.4vh;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:5.4vh;letter-spacing:.02em;line-height:1}
.days{display:flex;flex-direction:column;gap:1.8vh}
.day{background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;padding:1.4vh 2vw;display:flex;gap:2vw;align-items:center}
.day .dt{flex:none;width:14vh;text-align:center;font-family:var(--display);font-weight:800;line-height:1}
.day .dt span{display:block;font-size:3vh;letter-spacing:.06em;color:var(--muted)}
.day .dt em{display:block;font-style:normal;font-size:7vh}
.day .tm{display:flex;flex-direction:column;gap:.6vh;flex:1}
.day .tm div{display:flex;justify-content:space-between;gap:2vw;font-family:var(--display);font-weight:800;font-size:4.4vh;line-height:1.1;white-space:nowrap}
.day .tm div b{font-weight:600;color:var(--muted);text-transform:uppercase}
.day.today{border:.5vh solid var(--red);background:#2A1220}
.day.today .dt span{color:#fff}
.day.past{opacity:.35}
.tag{display:inline-block;background:var(--red);color:#fff;font-family:var(--display);font-weight:800;font-size:2.2vh;padding:.3vh .8vw;border-radius:99vh;margin-top:.8vh}
.none{font-size:4vh;color:var(--muted);margin-top:2vh}
.addr{margin-top:auto;font-size:2.7vh;color:var(--muted);line-height:1.4}
.addr b{color:var(--txt)}
.day.off{background:transparent;border-style:dashed}
.day.off .tm div{color:var(--muted)}
.day.off .tm small{font-family:var(--body);font-weight:500;font-size:2.8vh;color:var(--muted)}
.tn .wi{font-size:3vh;margin-top:.8vh;font-weight:700;color:#FFE28A}
.tn .left{display:inline-block;margin-left:.6vw;background:var(--red);color:#fff;border-radius:99vh;padding:.1vh .8vw;font-size:2.8vh}
.col{display:flex;flex-direction:column;min-height:0}
.tn{background:var(--panel);border:1px solid var(--line);border-radius:1.4vh;padding:1.6vh 1.6vw;margin-bottom:1.6vh}
.tn .nm{font-family:var(--display);font-weight:800;font-size:4.4vh;line-height:1.05}
.tn .when{font-size:3vh;margin-top:.6vh}
.tn .pay{font-size:3.2vh;margin-top:.8vh;color:#FFD3DA;font-weight:700}
.tn .free{font-size:3.2vh;margin-top:.8vh;color:#9BE3B9;font-weight:700}
.tn.paycard{display:flex;gap:1.6vw;align-items:center}
.tn.paycard .info{flex:1;min-width:0}
.qr{flex:none;background:#fff;color:var(--ink);border-radius:1.2vh;padding:1.2vh;text-align:center}
.qr svg{display:block;width:21vh;height:21vh}
.qr b{display:block;font-family:var(--display);font-weight:800;font-size:3.2vh;line-height:1;text-transform:uppercase;color:var(--red);margin-top:.6vh}
.notice{height:13vh;display:flex;align-items:center;gap:2vw;padding:0 3vw;background:var(--red);color:#fff;font-family:var(--display);font-weight:800;font-size:6vh;line-height:1.05}
.notice small{flex:none;font-size:3vh;letter-spacing:.08em;background:#fff;color:var(--red);padding:.6vh 1vw;border-radius:.8vh}
.notice[hidden]{display:none}
body.hasnote .main{height:77vh;padding-top:2.6vh}
body.hasnote .tn{padding:1.1vh 1.4vw;margin-bottom:1.2vh}
body.hasnote h2{margin-bottom:1.6vh}
body.hasnote .qr svg{width:18vh;height:18vh}
.btns{display:none}
/* Phones and other tall screens (the back-door sign's QR code opens this page): stack everything, let it scroll,
   and swap the scan-to-pay code for buttons, since you can't scan your own screen. */
@media (max-width:900px),(max-aspect-ratio:1/1){
  html,body{height:auto;overflow:auto;cursor:auto}
  html{background:var(--ink)}
  body{min-height:100vh}
  .top{height:auto;padding:12px max(16px,env(safe-area-inset-left,0px));gap:10px;flex-wrap:wrap}
  .top img{width:40px;height:40px}
  .top .club{font-size:20px}
  .top .clock{margin-left:0;width:100%;font-size:16px;font-weight:600;color:var(--muted)}
  .notice,body.hasnote .notice{height:auto;padding:12px 16px;font-size:22px;gap:10px;flex-wrap:wrap}
  .notice small{font-size:13px;padding:3px 8px}
  .main,body.hasnote .main{height:auto;grid-template-columns:1fr;gap:28px;padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  h2,body.hasnote h2{font-size:24px;margin-bottom:12px}
  .days{gap:10px}
  .day{padding:10px 14px;gap:14px;border-radius:10px}
  .day .dt{width:56px}
  .day .dt span{font-size:13px}
  .day .dt em{font-size:30px}
  .day .tm div{font-size:20px;white-space:normal}
  .day.off .tm small{font-size:14px}
  .tag{font-size:11px;padding:2px 6px}
  .none{font-size:18px}
  .addr{margin-top:16px;font-size:15px}
  .tn,body.hasnote .tn{padding:14px;border-radius:10px;margin-bottom:12px}
  .tn .nm{font-size:22px}
  .tn .when,.tn .wi,.tn .pay,.tn .free{font-size:16px}
  .tn .left{font-size:13px;padding:1px 8px}
  .qr{display:none}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .btn{display:inline-block;padding:10px 16px;border-radius:99px;background:#26324F;color:#fff;font-weight:700;font-size:16px;text-decoration:none}
  .btn.pay{background:var(--red)}
}
</style></head>
<body>
<div class="top"><img src="/handbook/logo.png" alt=""><div class="club">Stanley Wrestling Club</div><div class="clock" id="clock"></div></div>

      var pay='',canPay=m.pay;
      if(m.pay&&payLine){pay=payLine.split('. ')[0].replace(/\.$/,'');var dl=deadline(pay);if(dl==='closed'){canPay=false;pay=''}else if(dl)pay+=' <span class="left">'+dl+'</span>'}
      var info='<div class="nm">'+m.name+'</div><div class="when">'+when(m.lines[0]||'')+'</div>'+
        (wi?'<div class="wi">Team weigh-in: '+wi+'</div>':'')+
        (pay?'<div class="pay">'+pay+'</div>':free?'<div class="free">No fee</div>':'');
      var btns=(canPay?'<a class="btn pay" href="https://stanleywrestlingclub.org/tournaments" target="_blank" rel="noopener">Pay online</a>':'')+(m.flyer?'<a class="btn" href="'+m.flyer+'" target="_blank" rel="noopener">See the flyer</a>':'');
      info+=btns?'<div class="btns">'+btns+'</div>':'';
      return canPay?'<div class="tn paycard"><div class="info">'+info+'</div><div class="qr">'+QR+'<b>Scan to pay</b></div></div>':'<div class="tn">'+info+'</div>'}).join('')
      :'<div class="none">No tournaments coming up. Watch Heja for updates.</div>';
  }
  function renderNote(){$('noticeTxt').textContent=NOTE;$('notice').hidden=!NOTE;document.body.classList.toggle('hasnote',!!NOTE)}
  function render(){clock();renderDays();renderTourn();renderNote()}

  function loadSched(){return get('/schedule.js').then(function(js){var w={};new Function('window',js)(w);if(w.SWC&&w.SWC.times)SCHED=w.SWC})}
  function loadMeets(){return get('/').then(function(h){
    var doc=new DOMParser().parseFromString(h,'text/html');
    MEETS=[].map.call(doc.querySelectorAll('.meet[data-end]'),function(m){
      var sb=m.querySelector('.sub'),fl=sb&&sb.querySelector('a[href*="flyers/"]'),flyer=fl?new URL(fl.getAttribute('href'),'https://stanleywrestlingclub.org/').href:'';
      if(sb)[].forEach.call(sb.querySelectorAll('.goheja,a'),function(x){x.remove()});
      var lines=sb?sb.innerHTML.split(/<br\s*\/?>/).map(function(x){var e=document.createElement('div');e.innerHTML=x;return e.textContent.replace(/\s*·\s*$/,'').trim()}).filter(Boolean):[];
      return {end:m.getAttribute('data-end'),name:m.querySelector('.nm').textContent.trim(),lines:lines,pay:!!m.querySelector('.paylink'),flyer:flyer}});
  })}
  function loadNote(){if(!NOTICE_CSV){NOTE='';return Promise.resolve()}
    return get(NOTICE_CSV).then(function(csv){
      // cell A2 of the sheet: second line of the CSV, first field
      var rows=csv.split(/\r?\n/),r=rows[1]||'',v;
      if(r.charAt(0)==='"'){v='';for(var i=1;i<r.length;i++){if(r[i]==='"'){if(r[i+1]==='"'){v+='"';i++}else break}else v+=r[i]}}else v=r.split(',')[0];
      NOTE=v.trim();
    })}
  // Every refresh keeps the last good data if the Wi-Fi or the website is down, so the screen never goes blank.
  // each source draws as soon as it arrives, so a slow Google Sheet never holds up the practice times
  function refresh(){[loadSched,loadMeets,loadNote].forEach(function(f){f().then(render,function(){})})}
  refresh();
  setInterval(clock,10000);
  setInterval(render,60*1000);            // the day rolls over at midnight
  setInterval(refresh,15*60*1000);        // schedule and tournaments
  if(NOTICE_CSV)setInterval(function(){loadNote().then(renderNote).catch(function(){})},2*60*1000); // notice: every 2 minutes
  // Once a night (3 AM) reload the page itself, only if the site answers, to pick up any change to this screen.
  setInterval(function(){var n=new Date();if(n.getHours()===3&&n.getMinutes()<15)get('/tv/').then(function(){location.reload()}).catch(function(){})},15*60*1000);
})();
</script>
